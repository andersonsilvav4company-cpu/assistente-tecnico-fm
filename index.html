<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Assistente Técnico FM</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell">
  <header class="top" id="top"></header>
  <div class="app" id="app">
    <aside class="left" id="left"></aside>
    <main class="center">
      <header class="idea-head" id="head"></header>
      <div class="phase-bar" id="phasebar"></div>
      <div class="tools" id="tools"></div>
      <div class="pitch-wrap"><svg id="pitch" viewBox="0 0 680 1000" preserveAspectRatio="xMidYMid meet"></svg></div>
      <p class="hint" id="hint"></p>
    </main>
    <aside class="right">
      <nav class="rtabs" id="rtabs"></nav>
      <div class="rbody" id="rbody"></div>
    </aside>
  </div>
</div>
<div class="modal" id="modal" hidden></div>
<div class="toast" id="toast"></div>
<script src="data.js"></script>
<script src="engine.js"></script>
<script src="assistant.js"></script>
<script src="app.js"></script>
</body>
</html>
